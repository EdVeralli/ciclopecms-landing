<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificar email · Cíclope CMS</title>
    <!-- Icono de la solapa. Ninguna de las seis páginas lo declaraba, así que
         Chrome dibujaba el globo genérico: al lado de cualquier otra pestaña,
         Cíclope parecía una página sin dueño. Se recorta SÓLO el símbolo del
         logo — el texto «Cíclope CMS» a 16 px es una mancha. (19-ago-2026.) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f7f5; color:#111827; margin:0; display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .card { background:#fff; border:1px solid #cfe2dd; border-radius:16px; padding:48px 40px; max-width:440px; text-align:center; box-shadow:0 12px 32px rgba(0,0,0,.08); }
  .icon { font-size:54px; line-height:1; margin-bottom:12px; }
  h1 { color:#065f46; font-size:22px; margin:0 0 8px; }
  p { color:#4a5450; font-size:15px; margin:0 0 8px; }
  a.btn { display:inline-block; margin-top:20px; background:#2bb696; color:#fff; text-decoration:none; padding:12px 24px; border-radius:8px; font-weight:700; }
  .muted { color:#9ca3af; font-size:13px; }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="titulo">Verificando…</h1>
    <p id="msg">Un momento, estamos confirmando tu email.</p>
  </div>
<script>
  // 🔴 RUTA RELATIVA A PROPÓSITO — no poner acá el nombre de un backend.
  //
  // Hasta el 12-ago-2026 esto decía "https://demo.ciclopecms.com/api", que es
  // Cíclope LEGAL, sobre SQL Server. El alta, en cambio, hace POST a /registro
  // (relativo), que Nginx manda al backend del SaaS, sobre PostgreSQL. O sea
  // que el registro se guardaba en una base y el token se buscaba en la OTRA:
  // la fila existía, intacta y sin usar, y la pantalla decía «Token inválido o
  // ya utilizado» — literalmente cierto para la base donde miró, y por eso
  // nadie lo detectó. Nadie podía darse de alta en el SaaS.
  //
  // Funcionó hasta el 30-jul-2026, cuando había UN backend. La separación en
  // dos partió el circuito por el medio sin romper nada visible.
  //
  // Relativo significa que el destino lo decide UN solo lugar —el
  // `location /api/` de /etc/nginx/sites-enabled/ciclopecms— y deja de ser
  // posible que una mitad del circuito se mude sin la otra.
  const API = "/api";
  const params = new URLSearchParams(location.search);
  const token = params.get('token');
  const icon = document.getElementById('icon');
  const titulo = document.getElementById('titulo');
  const msg = document.getElementById('msg');
  const card = document.getElementById('card');
  // El titulo lo decide `cuenta_activa`, NO el hecho de que la llamada haya
  // salido bien. El email puede quedar verificado y la cuenta no crearse: si
  // esta pantalla dijera «activa» igual, la persona se iria a intentar entrar
  // con una cuenta que no existe. El backend ya distingue los tres casos y
  // manda el texto; aca solo se elige el tono y si se ofrece el boton.
  function ok(data){
    const activa = data.cuenta_activa !== false;   // sin el campo, se asume que si
    const email = data.email || '';
    if (activa) {
      icon.textContent = '✅';
      titulo.textContent = data.ya_estaba_verificado && !data.cuenta_creada
        ? 'Este email ya estaba confirmado'
        : '¡Tu cuenta está activa!';
      // En el camino feliz el texto lo pone la pagina: el `mensaje` del backend
      // dice lo mismo y quedaba repetido tres veces («Confirmaste X. Email
      // verificado. Tu cuenta esta activa.»). En el camino con problema SI se
      // usa el del backend, porque ahi el texto lleva la instruccion.
      msg.innerHTML = data.ya_estaba_verificado && !data.cuenta_creada
        ? 'Ya habías confirmado <b>' + email + '</b>. Entrá con tu usuario y contraseña.'
        : 'Confirmaste <b>' + email + '</b>. Te enviamos un correo con los datos de acceso.';
      card.insertAdjacentHTML('beforeend', '<a class="btn" href="https://saas.ciclopecms.com/">Ingresar a Cíclope</a>');
    } else {
      icon.textContent = '⚠️';
      titulo.textContent = 'Confirmamos tu email';
      msg.innerHTML = 'Verificamos <b>' + email + '</b>, pero la cuenta todavía no quedó creada. ' +
        (data.mensaje || '');
      card.insertAdjacentHTML('beforeend',
        '<p class="muted">Guardá este enlace: volver a abrirlo reintenta la creación.</p>');
    }
  }
  function fail(t){
    icon.textContent = '⚠️';
    titulo.textContent = 'No se pudo verificar';
    msg.textContent = t || 'El enlace es inválido o ya fue utilizado.';
    card.insertAdjacentHTML('beforeend', '<p class="muted">Si ya tenés cuenta, entrá directamente en saas.ciclopecms.com</p>');
  }
  if (!token) { fail('Falta el código de verificación en el enlace.'); }
  else {
    fetch(API + '/v1/public/verificar?token=' + encodeURIComponent(token))
      .then(async r => {
        const data = await r.json().catch(() => ({}));
        if (r.ok) ok(data); else fail(data.detail || 'El enlace es inválido o ya fue utilizado.');
      })
      .catch(() => fail('Error de conexión. Reintentá en un momento.'));
  }
</script>
</body>
</html>
